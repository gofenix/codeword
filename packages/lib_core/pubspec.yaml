name: lib_core
description: Core domain models, SM-2 algorithm, and shared utilities for CodeWord.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Local encrypted storage for BYOK (Keychain / EncryptedSharedPreferences)
  flutter_secure_storage: ^9.2.2

  # OpenAI-compatible LLM transport
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
