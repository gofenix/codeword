name: codeword_workspace

packages:
  - apps/*
  - packages/*

command:
  bootstrap:
    runPubGetInParallel: false

scripts:
  build:macos:
    description: Build the macOS app in debug mode.
    run: melos exec -c 1 -- "flutter build macos --debug"

  build:android:
    description: Build the Android debug APK.
    run: melos exec -c 1 --dir-exists="android" -- "flutter build apk --debug"

  analyze:
    description: Run flutter analyze across the workspace.
    run: melos exec -c 1 -- "flutter analyze"

  format:
    description: Run dart format across the workspace.
    run: melos exec -c 1 -- "dart format ."
